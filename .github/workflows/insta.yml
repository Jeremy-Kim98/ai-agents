name: 인스타 카드 (AI 뉴스 다음)

# AI 뉴스가 성공하면 이어서 실행: 2 편집 → 3 검증 → 4 카드 PNG. 결과는 docs/insta/<날짜>/ (GitHub Pages).
# 배포(인스타 게시)는 아직 없다. 규칙은 HARNESS.md.
on:
  workflow_run:
    workflows: ["AI 뉴스 (매일 06:30)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "카드 날짜 YYYY-MM-DD (비우면 오늘, 한국시간)"
        required: false
      items:
        description: "입력 JSON 경로 (비우면 docs/ai-news/<날짜>.json)"
        required: false

permissions:
  contents: write

concurrency:
  group: digest-commit       # 다른 에이전트와 커밋이 겹치지 않도록 순서대로
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # AI 뉴스가 방금 커밋한 결과 파일까지 받는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 한글 글꼴
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 입력 확인
        env:
          IN_DATE: ${{ inputs.date }}
          IN_ITEMS: ${{ inputs.items }}
        run: |
          D="${IN_DATE:-$(TZ=Asia/Seoul date +%F)}"
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "날짜 형식이 아닙니다: $D"; exit 1; }
          F="${IN_ITEMS:-docs/ai-news/$D.json}"
          [[ "$F" =~ ^(docs/ai-news|tests/fixtures/ai-news)/[0-9-]+\.json$ ]] || { echo "허용되지 않은 경로: $F"; exit 1; }
          [ -f "$F" ] || { echo "입력 파일이 없습니다: $F"; exit 1; }
          echo "D=$D" >> "$GITHUB_ENV"; echo "F=$F" >> "$GITHUB_ENV"
      - name: 카드 만들기 (편집·검증·렌더)
        run: python -m agents.insta --from-items "$F" --edit --out "docs/insta/$D" --record-cost
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTA_MAX_COST: ${{ vars.INSTA_MAX_COST }}
      - name: 결과 저장
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/insta data
          git diff --cached --quiet && exit 0
          git commit -m "인스타 카드 $D"
          git pull --rebase
          git push
